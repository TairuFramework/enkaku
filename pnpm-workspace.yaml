packages:
  - packages/*
  - tests/*
  - website

allowBuilds:
  '@biomejs/biome': true
  '@swc/core': false
  core-js: true
  core-js-pure: true
  electron: true
  esbuild: false
  msgpackr-extract: false
  unrs-resolver: true

blockExoticSubdeps: false

catalog:
  '@biomejs/biome': ^2.5.0
  '@dipakparmar/docusaurus-plugin-umami': ^3.0.0
  '@docusaurus/core': ^3.10.2
  '@docusaurus/faster': ^3.10.2
  '@docusaurus/module-type-aliases': ^3.10.2
  '@docusaurus/preset-classic': ^3.10.2
  '@docusaurus/theme-mermaid': ^3.10.2
  '@docusaurus/tsconfig': ^3.10.2
  '@docusaurus/types': ^3.10.2
  '@electron-forge/cli': ^7.11.2
  '@electron-forge/plugin-vite': ^7.11.2
  '@hono/node-server': ^2.1.0
  '@kigu/dev': ^0.2.1
  '@kokuin/capability': ^0.2.2
  '@kokuin/electron': ^0.4.1
  '@kokuin/token': ^0.4.0
  '@opentelemetry/sdk-trace-base': ^2.10.0
  '@opentelemetry/sdk-trace-node': ^2.10.0
  '@orama/plugin-docusaurus-v3': ^3.1.18
  '@playwright/test': 1.62.1
  '@sozai/async': ^0.2.1
  '@sozai/codec': ^0.4.0
  '@sozai/event': ^0.1.3
  '@sozai/execution': ^0.2.1
  '@sozai/json': ^0.1.1
  '@sozai/log': ^0.3.1
  '@sozai/otel': ^0.3.2
  '@sozai/runtime': ^0.1.0
  '@sozai/schema': ^0.1.1
  '@sozai/stream': ^0.2.0
  '@swc/cli': ^0.8.1
  '@swc/core': ^1.15.41
  '@testing-library/jest-dom': ^7.0.0
  '@testing-library/react': ^16.3.2
  '@types/node': ^26.1.2
  '@types/react': ^19.2.18
  '@vitejs/plugin-react': ^6.0.5
  '@vitest/ui': ^4.1.9
  del-cli: ^7.0.0
  electron: ^43.3.0
  eventsource-parser: ^3.1.0
  get-port: ^7.2.0
  happy-dom: ^20.11.1
  react: 19.2.3
  react-dom: 19.2.3
  react-native-electron: ^0.22.1
  react-native-web: 0.21.2
  tsx: ^4.22.4
  turbo: ^2.9.18
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.12.0
  typescript: ^6.0.3
  vite: ^8.2.1
  vitest: ^4.1.10

catalogMode: prefer

minimumReleaseAgeExclude:
  - '@kigu/*'
  - '@kokuin/*'
  - '@sozai/*'

overrides:
  # extract-zip 2.0.1 (via @electron/packager) pulls yauzl 2.10.0, whose
  # extraction lets Node exit 0 mid-package on some runtimes (node 24.17, 26).
  # yauzl 3.x keeps the event loop alive through extraction. See e2e-desktop.
  yauzl: ^3.4.0

nodeLinker: hoisted

supportedArchitectures:
  cpu: [ current ]
  os: [ current ]

publishBranch: main

versioning:
  changelog:
    storage: repository
  # All published packages move as one version. Globs are not supported, so the
  # group is listed by exact name.
  fixed:
    - - '@enkaku/client'
      - '@enkaku/electron'
      - '@enkaku/http-fetch'
      - '@enkaku/http-serve'
      - '@enkaku/message'
      - '@enkaku/node-streams'
      - '@enkaku/otel'
      - '@enkaku/protocol'
      - '@enkaku/react'
      - '@enkaku/server'
      - '@enkaku/socket'
      - '@enkaku/standalone'
      - '@enkaku/transport'
  # Private packages are never released. They must be listed by exact name --
  # `versioning.ignore` does not accept globs, and leaving one out makes
  # `pnpm change status` / `pnpm version -r` fail once a bump has to propagate
  # into it.
  ignore:
    - deno-tests
    - e2e-electron
    - integration-tests
    - website
